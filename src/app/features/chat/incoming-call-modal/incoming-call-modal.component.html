<div class="incoming-call-overlay" *ngIf="webrtcService.incomingCall() as call">
  <div class="call-modal glass-panel">
    
    <div class="avatar-container">
      <div class="ripple"></div>
      <div class="ripple delay-1"></div>
      <div class="ripple delay-2"></div>
      
      <img *ngIf="callerAvatar(); else charAvatar" [src]="callerAvatar()" alt="Caller Avatar" class="avatar-img">
      <ng-template #charAvatar>
        <div class="avatar-placeholder">{{ avatarChar }}</div>
      </ng-template>
    </div>

    <h2 class="caller-name">{{ callerName() }}</h2>
    <p class="call-type">Incoming {{ call.type === 'video' ? 'Video' : 'Audio' }} Call...</p>

    <div class="actions">
      <button class="btn decline" (click)="declineCall()" [disabled]="isAccepting()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path>
          <line x1="23" y1="1" x2="1" y2="23"></line>
        </svg>
      </button>

      <button class="btn accept" (click)="acceptCall()" [disabled]="isAccepting()">
        <ng-container *ngIf="!isAccepting(); else spinner">
          <svg *ngIf="call.type === 'video'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <svg *ngIf="call.type === 'voice'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </ng-container>
        <ng-template #spinner>
          <div class="loader"></div>
        </ng-template>
      </button>
    </div>
  </div>
</div>
