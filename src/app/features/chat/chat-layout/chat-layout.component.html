<div class="app-layout" [class.chat-active]="outlet.isActivated" [class.profile-active]="layoutState.activeMenuView() === 'profile'">
  
  <aside class="sidebar-column">
    <app-conversation-list></app-conversation-list>
    
    <!-- Main Menu Overlay -->
    @if (layoutState.isMainMenuOpen()) {
      <div class="menu-overlay">
        <app-main-menu></app-main-menu>
      </div>
    }
  </aside>

  <main class="chat-column">
    <router-outlet #outlet="outlet"></router-outlet>
    
    <!-- Active View Overlay (e.g. Profile) -->
    @if (layoutState.activeMenuView() === 'profile') {
      <div class="view-overlay">
        <app-user-profile></app-user-profile>
      </div>
    }

    <!-- Backdrop when menu is open -->
    @if (layoutState.isMainMenuOpen() && !layoutState.activeMenuView()) {
      <div class="chat-backdrop" (click)="layoutState.closeMenu()"></div>
    }
    
    @if (!outlet.isActivated) {
      <div class="empty-layout-state fade-in">
        <div class="watermark-logo">
          <app-logo width="200px"></app-logo>
        </div>
        <h2>Select a conversation to start messaging</h2>
        <p>Your messages are protected with end-to-end encryption.</p>
      </div>
    }
  </main>

</div>

<!-- Global Incoming Call Modal overlay -->
<app-incoming-call-modal></app-incoming-call-modal>

<!-- Active Call View -->
<app-active-call></app-active-call>
