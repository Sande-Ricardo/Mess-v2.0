<div class="voice-recorder-container">
  
  <div class="recording-indicator" *ngIf="!isUploading">
    <div class="blinking-dot"></div>
    <span class="recording-time">{{ formattedTime }}</span>
  </div>

  <div class="upload-indicator" *ngIf="isUploading">
    <span class="spinner"></span>
    <span class="upload-text">Sending...</span>
  </div>

  <div class="waveform-container" *ngIf="!isUploading">
    <div 
      class="waveform-bar" 
      *ngFor="let barHeight of bars; let i = index"
      [style.height.%]="barHeight * 100"
    ></div>
  </div>

  <div class="actions">
    <button class="btn-action btn-cancel" (click)="onCancel()" title="Delete Recording" [disabled]="isUploading">
      <span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </span>
    </button>
    
    <button class="btn-action btn-confirm" (click)="onConfirm()" title="Send Voice Message" [disabled]="isUploading">
      <span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </span>
    </button>
  </div>
  
</div>
