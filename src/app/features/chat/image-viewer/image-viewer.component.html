<div class="viewer-backdrop" (click)="close()">
  
  <header class="viewer-header" (click)="$event.stopPropagation()">
    <div class="counter">
      {{ currentIndex() + 1 }} / {{ images.length }}
    </div>
    
    <button class="icon-btn close-btn" (click)="close()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </header>

  <div class="viewer-content">
    
    <button class="nav-btn prev" *ngIf="images.length > 1" (click)="prevImage($event)">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    
    <div class="image-wrapper" (click)="$event.stopPropagation()">
      <img [src]="images[currentIndex()]" class="active-image" alt="Enlarged view" />
    </div>

    <button class="nav-btn next" *ngIf="images.length > 1" (click)="nextImage($event)">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

  </div>

</div>
