<div class="chat-wrapper">

  <!-- Header -->
  <header class="chat-header glass-panel">
    <div class="contact-info">
      <button class="icon-btn mobile-back-btn" (click)="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div class="avatar-mock">
        @if (contactAvatarUrl()) {
        <img [src]="contactAvatarUrl()" alt="Avatar" class="avatar-img" />
        } @else {
        {{ contactName().charAt(0) }}
        }
      </div>
      <div class="details">
        <h2>{{ contactName() }}</h2>
        <span class="status">{{ contactStatus() }}</span>
      </div>
    </div>

    <div class="security-badge">
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </span>
      <span class="text">E2E active</span>
    </div>
  </header>

  <!-- Message List (Virtual Scroll) -->
  <div class="message-area">
    <cdk-virtual-scroll-viewport itemSize="60" class="scroll-viewport" #scrollViewport>

      <div *cdkVirtualFor="let msg of messages()" class="message-row" [class.me]="msg.senderId === myUid()">
        <div class="bubble" [class.deleted]="msg.type === 'deleted'">

          <ng-container *ngIf="msg.type !== 'deleted'; else deletedTpl">

            <ng-container *ngIf="msg.type === 'voice'">
              <app-voice-message [audioUrl]="msg.content"></app-voice-message>
            </ng-container>

            <ng-container *ngIf="msg.type === 'image'">
              <img [src]="msg.content" class="chat-image-attachment" alt="Image attachment" (click)="openImage(msg.content)" style="cursor: pointer;" />
            </ng-container>

            <ng-container *ngIf="msg.type === 'text'">
              <span class="content">{{ msg.content }}</span>
            </ng-container>

            <span class="time">{{ msg.timestamp | date:'shortTime' }}</span>
          </ng-container>

          <ng-template #deletedTpl>
            <span class="content deleted-text">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
              </svg>
              This message was deleted
            </span>
          </ng-template>

        </div>
      </div>

    </cdk-virtual-scroll-viewport>

    <!-- Typing Indicator Overlay -->
    <div class="typing-indicator" *ngIf="typingUsers().length > 0">
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
      <span class="text">writing...</span>
    </div>
  </div>

  <!-- Compose Footer -->
  <footer class="chat-footer glass-panel">
  
    <input type="file" #imageInput accept="image/*" (change)="onImageSelected($event)" style="display: none;">

    <ng-container *ngIf="!isRecordingVoice; else recordingTpl">
      <button class="icon-btn attachment" (click)="triggerImageSelection()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
          </path>
        </svg>
      </button>

      <div class="input-wrapper">
        <div class="preview-overlay" *ngIf="selectedImagePreview">
          <div class="preview-content">
            <img [src]="selectedImagePreview" alt="Selected Image" />
            <button class="remove-btn" (click)="clearAttachment()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
        <textarea cdkTextareaAutosize #autosize="cdkTextareaAutosize" cdkAutosizeMinRows="1" cdkAutosizeMaxRows="5"
          class="message-input" placeholder="Write a message.." [(ngModel)]="newMessage" (input)="onInput()"
          (keydown)="onKeyDown($event)"></textarea>
      </div>

      <button class="icon-btn mic" *ngIf="!newMessage.trim()" (click)="isRecordingVoice = true">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <button class="icon-btn send" *ngIf="newMessage.trim() || selectedImageFile" (click)="sendMessage()">
        <ng-container *ngIf="!isUploadingAttachment; else loadingSpinner">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </ng-container>
        <ng-template #loadingSpinner>
          <div class="spinner"></div>
        </ng-template>
      </button>
    </ng-container>

    <ng-template #recordingTpl>
      <app-voice-recorder class="flex-1" [chatContextId]="convId()" (dismiss)="isRecordingVoice = false">
      </app-voice-recorder>
    </ng-template>

  </footer>

  <!-- Image Viewer Overlay -->
  <app-image-viewer 
    *ngIf="activeImageIndex() !== null"
    [images]="chatImages()"
    [initialIndex]="activeImageIndex()!"
    (dismiss)="closeImageViewer()">
  </app-image-viewer>

</div>
