<div class="chat-wrapper">
  
  <!-- Header -->
  <header class="chat-header glass-panel">
    <div class="contact-info">
      <div class="avatar-mock">
        {{ contactName.charAt(0) }}
      </div>
      <div class="details">
        <h2>{{ contactName }}</h2>
        <span class="status">{{ contactStatus }}</span>
      </div>
    </div>
    
    <div class="security-badge">
      <span class="icon">🔒</span>
      <span class="text">E2E activo</span>
    </div>
  </header>

  <!-- Message List (Virtual Scroll) -->
  <div class="message-area">
    <cdk-virtual-scroll-viewport itemSize="60" class="scroll-viewport" #scrollViewport>
      
      <div *cdkVirtualFor="let msg of messages" class="message-row" [class.me]="msg.senderId === myUid">
        <div class="bubble" [class.deleted]="msg.type === 'deleted'">
          
          <ng-container *ngIf="msg.type !== 'deleted'; else deletedTpl">
            <span class="content">{{ msg.content }}</span>
            <span class="time">{{ msg.timestamp | date:'shortTime' }}</span>
          </ng-container>
          
          <ng-template #deletedTpl>
            <span class="content deleted-text">🚫 This message was deleted</span>
          </ng-template>

        </div>
      </div>

    </cdk-virtual-scroll-viewport>

    <!-- Typing Indicator Overlay -->
    <div class="typing-indicator" *ngIf="typingUsers.length > 0">
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
      <span class="text">escribiendo...</span>
    </div>
  </div>

  <!-- Compose Footer -->
  <footer class="chat-footer glass-panel">
    <button class="icon-btn attachment">
      <!-- Mock Icon -->
      📎
    </button>
    
    <div class="input-wrapper">
      <textarea 
        cdkTextareaAutosize
        #autosize="cdkTextareaAutosize"
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="5"
        class="message-input"
        placeholder="Escribe un mensaje..."
        [(ngModel)]="newMessage"
        (input)="onInput()"
        (keydown)="onKeyDown($event)"></textarea>
    </div>

    <button class="icon-btn mic" *ngIf="!newMessage.trim()">
      🎤
    </button>

    <button class="icon-btn send" *ngIf="newMessage.trim()" (click)="sendMessage()">
      ➤
    </button>
  </footer>

</div>
